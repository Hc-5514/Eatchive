name: "Codex 작업 요청"
description: "PM 에이전트가 관리하는 자동화 작업 생성"
title: ""
labels: [ "codex" ]
body:
  - type: markdown
    attributes:
      value: |
        > **등록 후 라벨 추가 필수:** `codex` (자동) + 역할 라벨 (`backend`/`frontend`/`devops`/`db`/`test`/`docs`) + 우선순위 라벨 (`P0`/`P1`/`P2`)

  - type: input
    id: task
    attributes:
      label: 작업 내용
      description: 명사형으로 작성
      placeholder: "JWT 리프레시 토큰 인증 추가"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 유형
      options:
        - feat (신규 기능)
        - fix (버그 수정)
        - refactor (리팩토링)
        - docs (문서화)
        - chore (유지보수)
        - test (테스트)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 (즉시)
        - P1 (높음)
        - P2 (보통)
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: 담당 에이전트
      description: 주 담당 역할 선택
      options:
        - PM
        - DB
        - Backend
        - Frontend
        - DevOps
        - Tester
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 실행 단계
      options:
        - "Phase 0 – Decision Readiness"
        - "Phase 1 – Foundation"
        - "Phase 2 – CRUD & Places"
        - "Phase 3 – Image Pipeline"
        - "Phase 4 – Monitoring & Metrics"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 명사형 체크리스트
      placeholder: |
        - [ ] 이메일/비밀번호 회원가입 구현
        - [ ] 로그인 시 JWT 토큰 발급
        - [ ] 유효하지 않은 토큰 접근 차단
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 의존성
      description: "선행 이슈 번호 나열 (없으면 '없음')"
      placeholder: |
        - Depends on #3 (BE-Common)
        - Depends on #4 (DB-01)

  - type: textarea
    id: context
    attributes:
      label: 추가 컨텍스트
      description: 제약 조건, 참고 사항, 리스크 참조
      placeholder: |
        - 리스크 참조: R-05 (Soft delete 보호)
        - Planning doc §10 참조
        - 제약: Java 17 전용 기능만 사용