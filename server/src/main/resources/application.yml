spring:
  application:
    name: eatchive
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

aws:
  region: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 1m

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: info
    com.eatchive: info

server:
  error:
    include-message: never
  tomcat:
    threads:
      max: 200

eatchive:
  timezone: Asia/Seoul
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 3600
  storage:
    bucket: ${S3_BUCKET_NAME}
    presigned-expiration-minutes: 15
    max-images-per-review: 10
  image:
    queue:
      exchange: eatchive.image
      resize:
        routing-key: image.resize
        dlq-routing-key: image.resize.dlq
